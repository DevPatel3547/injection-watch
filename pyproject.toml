[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "injectionwatch"
version = "0.3.0"
description = "Open feed of indirect prompt injections and AI-agent cloaking found on the web"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-DATA.md"]
authors = [{name = "Dev Patel"}]
requires-python = ">=3.11"
keywords = ["prompt-injection", "llm-security", "ai-agents", "threat-intelligence", "stix", "common-crawl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["beautifulsoup4>=4.12", "lxml>=5", "requests>=2.31", "warcio>=1.7"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
llm = ["anthropic>=0.40"]
mcp = ["mcp>=2"]
render = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "stix2>=3", "ruff>=0.6", "mypy>=1.10", "types-requests"]

[project.scripts]
injectionwatch = "injectionwatch.cli:main"
injectionwatch-mcp = "injectionwatch.mcp_server:main"

[tool.setuptools.packages.find]
include = ["injectionwatch*"]

[tool.setuptools.package-data]
injectionwatch = ["data/*.json", "js/*.js", "site/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:unclosed database:ResourceWarning", "ignore::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["injectionwatch"]
concurrency = ["greenlet", "thread"]
omit = ["injectionwatch/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["extension/node_modules", "site", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # multilingual fixtures/rules legitimately contain non-ASCII lookalikes
  "SIM105",                      # explicit try/except/pass reads better in a few places
  "UP031",                       # %-format kept where it builds SQL placeholder lists
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117", "RUF012", "E501"]
"scripts/*" = ["E402", "E501"]

[tool.mypy]
python_version = "3.11"
packages = ["injectionwatch"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["warcio.*", "playwright.*", "mcp.*", "stix2.*", "anthropic.*", "uvicorn.*", "bs4.*", "soupsieve.*"]
ignore_missing_imports = true
