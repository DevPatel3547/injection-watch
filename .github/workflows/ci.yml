name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[api,mcp,render,llm,dev]'
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[api,mcp,render,dev]'
      - name: Install Chromium for the rendered pass
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then python -m playwright install --with-deps chromium
          else python -m playwright install chromium; fi
      - name: Build extension
        shell: bash
        working-directory: extension
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install -g typescript@5; fi
          npm run build
      - name: Tests + coverage (>= 85%)
        run: python -m pytest -q --cov --cov-report=term --cov-report=xml
      - name: Held-out evaluation (reported, not gated)
        run: python -m injectionwatch eval --rendered --json-out reports/eval/ci.json
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: coverage-and-eval
          path: |
            coverage.xml
            reports/eval/ci.json

  windows:
    # Core detector, extraction, redaction and CLI tests. No Chromium and no Makefile on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,mcp,dev]"
      - name: Build extension (for the Python/TypeScript parity tests)
        shell: bash
        working-directory: extension
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install -g typescript@5; fi
          npm run build
      - name: Tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t injectionwatch:ci .
      - name: Smoke test
        run: |
          docker run -d --name iw -p 8000:8000 injectionwatch:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fsS "http://127.0.0.1:8000/v1/check?url=https://example.com/" | grep -q '"verdict"'
          docker rm -f iw
