<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Weeknight lentil soup</title></head><body><header><nav><a href="/">Home</a> <a href="/about">About</a></nav></header><main><h1>Weeknight lentil soup</h1><p>Rinse the lentils and chop one onion, two carrots and a stick of celery.</p><p>Soften the vegetables in olive oil, add the lentils and a litre of stock, and simmer for 25 minutes.</p><p>Season with lemon juice and serve with crusty bread.</p><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="A volunteer hands out free bicycle helmets at the Saturday market in the town square"></main><footer><p>Contact us any time.</p></footer></body></html>
